[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bohrs-atommodell"
version = "1.0.0"
description = "Quantitative historical Bohr model with gold 3D scenes and scientific plots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "moderngl>=5.12,<6", "Pillow>=11,<13"]

[project.scripts]
bohr-atom = "bohr_atom.cli:main"

[project.optional-dependencies]
video = ["av>=14,<19"]
viewer = ["glfw>=2.8,<3"]
all = ["av>=14,<19", "glfw>=2.8,<3"]
dev = ["av>=14,<19", "glfw>=2.8,<3", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
